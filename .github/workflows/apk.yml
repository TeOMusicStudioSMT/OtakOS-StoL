# 📲 StoL — APK do pobrania na telefon, budowany przez GitHuba.
# Suweren (2026-09-26): „nie udało mi się zainstalować tego na telefonie… trzeba prostszy sposób".
# Po każdym push na main powstaje wydanie „StoL — najnowszy" z plikiem StoL.apk
# (Releases w repo → pobierz na telefonie → zainstaluj). PR-y budują APK jako artefakt.
name: StoL APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stol-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Android SDK jest już na obrazie ubuntu-latest (ANDROID_HOME). Akcja setup-android@v3
      # padała na nieistniejącym pakiecie „tools”; brakujące platformy AGP dociąga sam.
      - name: Android SDK z obrazu
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      # Repo nie ma gradlew (projekt z AI Studio) — Gradle w wersji z gradle-wrapper.properties.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # Klucz podpisu: WYŁĄCZNIE z sekretu repo STOL_KEYSTORE_B64 (keystore w base64).
      # Ten sam klucz = każda nowa wersja instaluje się NA poprzednią, bez odinstalowania.
      # Dawniej klucz leżał w cache Actions — w publicznym repo cache potrafią odczytać buildy
      # PR-ów z forków, a sam wygasał po ~7 dniach. Sekrety do forków nie trafiają.
      #   · wydanie (push na main / ręcznie) bez sekretu → STOP z komunikatem (APK z obcym
      #     kluczem nie zainstalowałby się na StoL-a Suwerena),
      #   · PR bez sekretu (np. z forka) → jednorazowy klucz, APK tylko do sprawdzenia.
      - name: Klucz podpisu z sekretu
        env:
          KLUCZ_B64: ${{ secrets.STOL_KEYSTORE_B64 }}
        run: |
          if [ -n "$KLUCZ_B64" ]; then
            printf '%s' "$KLUCZ_B64" | base64 -d > debug.keystore
            echo "Klucz ze stałego sekretu STOL_KEYSTORE_B64."
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 30 -dname "CN=StoL PR,O=jednorazowy,C=PL"
            echo "::notice::PR bez sekretu — APK podpisany jednorazowym kluczem, tylko do sprawdzenia (nie zainstaluje się na StoL-a)."
          else
            echo "::error::Brak sekretu STOL_KEYSTORE_B64 — dodaj go: Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          # Odcisk certyfikatu (publiczny) — po nim widać, którym kluczem podpisano wydanie.
          keytool -list -v -keystore debug.keystore -storepass android | grep -m1 'SHA256:'

      - name: Buduj APK
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: StoL-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Testy rdzenia połączenia z mostem (com.example.most)
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.example.most.*'

      - name: Wydanie „StoL — najnowszy”
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk StoL.apk
          gh release delete najnowszy --yes --cleanup-tag || true
          gh release create najnowszy StoL.apk --prerelease \
            --title "StoL — najnowszy" \
            --notes "Zbudowane z ${GITHUB_SHA::7}. Na telefonie: pobierz StoL.apk → otwórz → pozwól na instalację z tego źródła. Potem w Katedrze: Dashboard → karta StoL → Paruj telefon → zeskanuj QR aparatem."
